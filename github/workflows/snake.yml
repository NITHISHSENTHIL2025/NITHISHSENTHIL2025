name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: NITHISHSENTHIL2025
          outputs: |
           dist/github-contribution-grid-snake.svg?color_dots=%23FFFFFF,%23FFE8E8,%23FFC9C9,%23F87171,%23C1121F
           dist/github-contribution-grid-snake-dark.svg?color_dots=%23050505,%232A0A0A,%235C1010,%23A61B1B,%23FF3B3B

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
