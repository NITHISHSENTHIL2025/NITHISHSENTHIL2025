name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: 
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: NITHISHSENTHIL2025
          outputs: |
            dist/github-contribution-grid-snake.svg?color_dots=#F4F4F5,#FCA5A5,#EF4444,#DC2626,#7F1D1D
            dist/github-contribution-grid-snake-dark.svg?color_dots=#09090B,#7F1D1D,#B91C1C,#DC2626,#EF4444
            
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
